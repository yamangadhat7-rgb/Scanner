<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سكانر برو — تحويل الصور إلى PDF احترافي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --blue:#2563eb;--blue-700:#1d4ed8;--blue-50:#eff6ff;--blue-100:#dbeafe;--blue-200:#bfdbfe;
  --ink:#0f172a;--muted:#64748b;--muted-2:#94a3b8;
  --line:#e2e8f0;--line-2:#cbd5e1;
  --bg:#ffffff;--surface:#f8fafc;--card:#ffffff;
  --danger:#dc2626;--danger-50:#fef2f2;
  --success:#059669;
  --shadow:0 2px 8px rgba(15,23,42,.05);
  --shadow-md:0 6px 20px rgba(15,23,42,.08);
  --shadow-lg:0 20px 60px rgba(15,23,42,.18);
  --radius:14px;
  --transition:.18s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --ink:#f1f5f9;--muted:#94a3b8;--muted-2:#64748b;
  --line:#1e293b;--line-2:#334155;
  --bg:#0b1220;--surface:#0f172a;--card:#1e293b;
  --blue-50:#172554;--blue-100:#1e3a8a;--blue-200:#1e40af;
  --danger-50:#450a0a;
  --shadow:0 2px 8px rgba(0,0,0,.3);
  --shadow-md:0 6px 20px rgba(0,0,0,.4);
  --shadow-lg:0 20px 60px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100vh}
body{
  font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
  transition:background var(--transition),color var(--transition);
  overflow-x:hidden;
}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
svg{display:block}

/* ============ HEADER ============ */
header{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px) saturate(180%);
  -webkit-backdrop-filter:blur(14px) saturate(180%);
  border-bottom:1px solid var(--line);
}
.header-inner{
  max-width:1320px;margin:0 auto;padding:12px 22px;
  display:flex;align-items:center;gap:12px;
}
.logo{
  width:42px;height:42px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,var(--blue) 0%,var(--blue-700) 100%);
  display:grid;place-items:center;color:#fff;
  box-shadow:0 6px 18px rgba(37,99,235,.35);
  transition:transform var(--transition);
}
.logo:hover{transform:rotate(-6deg) scale(1.05)}
.brand h1{font-size:16.5px;margin:0;font-weight:800;letter-spacing:-.3px;line-height:1.1}
.brand p{margin:2px 0 0;font-size:11.5px;color:var(--muted);font-weight:600}
.header-actions{margin-inline-start:auto;display:flex;gap:8px;align-items:center}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 15px;border-radius:11px;font-size:13px;font-weight:700;
  cursor:pointer;transition:all var(--transition);white-space:nowrap;
  position:relative;overflow:hidden;
}
.btn:hover{border-color:var(--line-2);background:var(--surface);transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-700);border-color:var(--blue-700);box-shadow:0 6px 18px rgba(37,99,235,.35)}
.btn.primary:disabled{background:var(--blue-200);border-color:var(--blue-200);cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--blue-50);border-color:var(--blue-200);color:var(--blue-700)}
.btn.danger{color:var(--danger);border-color:var(--line)}
.btn.danger:hover{background:var(--danger-50);border-color:#fecaca}
.btn.icon-only{padding:9px;width:38px;height:38px}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary svg{stroke:currentColor}
@media(max-width:700px){
  .header-inner{padding:10px 14px}
  .brand p{display:none}
  .header-actions .lbl{display:none}
  .header-actions .btn{padding:9px 11px}
}

/* ============ THEME TOGGLE ============ */
.theme-toggle{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);display:grid;place-items:center;transition:all var(--transition);
}
.theme-toggle:hover{background:var(--surface);transform:rotate(15deg)}
.theme-toggle svg{width:17px;height:17px;stroke:var(--ink)}
[data-theme="dark"] .icon-sun{display:block}
[data-theme="dark"] .icon-moon{display:none}
.icon-sun{display:none}
.icon-moon{display:block}

/* ============ MAIN ============ */
main{max-width:1320px;margin:0 auto;padding:24px 22px 100px}
@media(max-width:700px){main{padding:16px 14px 100px}}

/* ============ DROP ZONE ============ */
.drop{
  border:2px dashed var(--line-2);border-radius:20px;
  padding:52px 24px;text-align:center;background:var(--surface);
  transition:all .22s cubic-bezier(.4,0,.2,1);cursor:pointer;position:relative;
  overflow:hidden;
}
.drop::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(600px circle at var(--mx,50%) var(--my,50%),var(--blue-50),transparent 40%);
  opacity:0;transition:opacity var(--transition);
}
.drop:hover::before,.drop.over::before{opacity:1}
.drop:hover,.drop.over{border-color:var(--blue);background:var(--surface)}
.drop.over{transform:scale(1.005);border-style:solid}
.drop-icon{
  width:64px;height:64px;margin:0 auto 16px;border-radius:18px;
  background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--blue);
  box-shadow:var(--shadow-md);transition:transform var(--transition);
  position:relative;z-index:1;
}
.drop.over .drop-icon{transform:scale(1.1) rotate(-4deg)}
.drop-title{font-size:17px;font-weight:800;margin-bottom:6px;position:relative;z-index:1}
.drop-sub{font-size:13px;color:var(--muted);font-weight:600;position:relative;z-index:1}
.drop-formats{
  display:flex;gap:6px;justify-content:center;margin-top:14px;
  font-size:11px;color:var(--muted-2);font-weight:700;position:relative;z-index:1;
}
.drop-formats span{background:var(--card);border:1px solid var(--line);padding:3px 9px;border-radius:20px}

/* ============ TOOLBAR ============ */
.toolbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin:20px 0 16px;padding:10px 14px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  animation:slideDown .25s ease both;
}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.toolbar .spacer{flex:1}
.count-badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12.5px;font-weight:800;color:var(--blue-700);
  background:var(--blue-50);border:1px solid var(--blue-200);
  padding:6px 12px;border-radius:20px;
}
[data-theme="dark"] .count-badge{color:var(--blue-200)}
.count-badge svg{width:13px;height:13px}
.view-toggle{
  display:inline-flex;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:3px;gap:2px;
}
.view-toggle button{
  border:0;background:transparent;padding:6px 10px;border-radius:7px;
  display:grid;place-items:center;color:var(--muted);transition:all var(--transition);
}
.view-toggle button.active{background:var(--blue);color:#fff;box-shadow:0 2px 6px rgba(37,99,235,.3)}
.view-toggle svg{width:15px;height:15px}

/* ============ GRID ============ */
.grid{
  display:grid;gap:16px;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  animation:fadeIn .3s ease both;
}
.grid.compact{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  overflow:hidden;transition:all var(--transition);display:flex;flex-direction:column;
  animation:cardIn .28s cubic-bezier(.34,1.56,.64,1) both;
  position:relative;
}
@keyframes cardIn{from{opacity:0;transform:scale(.94) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
.card:hover{box-shadow:var(--shadow-md);border-color:var(--line-2);transform:translateY(-3px)}
.card.selected{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-50),var(--shadow-md)}
.card.dragging{opacity:.35;transform:scale(.96)}
.card.over{outline:2px dashed var(--blue);outline-offset:-3px;background:var(--blue-50)}
.grid.compact .thumb{height:130px}
.grid.compact .card-body{padding:8px;gap:6px}
.grid.compact .row select{font-size:11.5px;padding:5px 7px}
.grid.compact .ico{width:28px;height:28px}

.thumb{
  position:relative;background:linear-gradient(135deg,var(--surface),var(--line));
  height:200px;display:grid;place-items:center;padding:10px;
  cursor:zoom-in;overflow:hidden;
}
.thumb canvas{
  max-width:100%;max-height:180px;width:auto;height:auto;
  border-radius:5px;background:#fff;
  box-shadow:0 3px 12px rgba(15,23,42,.18);
  transition:transform var(--transition);
}
.thumb:hover canvas{transform:scale(1.02)}
.num{
  position:absolute;top:8px;inset-inline-start:8px;
  background:var(--blue);color:#fff;font-size:11.5px;font-weight:800;
  min-width:26px;height:26px;border-radius:8px;
  display:grid;place-items:center;padding:0 7px;
  box-shadow:0 3px 9px rgba(37,99,235,.5);
  pointer-events:none;
}
.select-chk{
  position:absolute;top:8px;inset-inline-end:8px;
  width:24px;height:24px;border-radius:7px;
  background:rgba(255,255,255,.95);border:2px solid var(--line-2);
  display:grid;place-items:center;cursor:pointer;
  transition:all var(--transition);backdrop-filter:blur(4px);
  z-index:2;
}
.select-chk:hover{border-color:var(--blue);transform:scale(1.08)}
.select-chk svg{width:13px;height:13px;stroke:transparent;transition:stroke var(--transition)}
.card.selected .select-chk{background:var(--blue);border-color:var(--blue)}
.card.selected .select-chk svg{stroke:#fff}
.card-body{padding:10px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.row{display:flex;gap:6px;align-items:center}
.row select{
  flex:1;border:1px solid var(--line);background:var(--card);border-radius:9px;
  padding:6px 9px;font-size:12px;font-weight:700;color:var(--ink);
  cursor:pointer;outline:none;transition:all var(--transition);
}
.row select:hover{border-color:var(--line-2)}
.row select:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-50)}
.ico{
  width:32px;height:32px;flex:none;border-radius:9px;
  border:1px solid var(--line);background:var(--card);color:var(--muted);
  display:grid;place-items:center;cursor:pointer;transition:all var(--transition);
}
.ico:hover{background:var(--blue-50);border-color:var(--blue-200);color:var(--blue-700)}
.ico.del:hover{background:var(--danger-50);border-color:#fecaca;color:var(--danger)}
.ico svg{width:15px;height:15px}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:700;font-size:12.5px;color:var(--muted);user-select:none}
.chk input{accent-color:var(--blue);width:15px;height:15px;cursor:pointer;margin:0}

/* ============ EMPTY ============ */
.empty{
  grid-column:1/-1;text-align:center;padding:60px 20px;
  color:var(--muted);animation:fadeIn .4s ease both;
}
.empty-icon{
  width:88px;height:88px;margin:0 auto 18px;border-radius:24px;
  background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--muted-2);
}
.empty h3{margin:0 0 6px;font-size:16px;font-weight:800;color:var(--ink)}
.empty p{margin:0;font-size:13px;font-weight:600}

/* ============ BULK BAR ============ */
.bulk-bar{
  position:fixed;bottom:24px;left:50%;transform:translate(-50%,120%);
  background:var(--ink);color:#fff;padding:10px 12px 10px 10px;
  border-radius:16px;display:flex;align-items:center;gap:8px;
  box-shadow:var(--shadow-lg);z-index:80;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  max-width:calc(100vw - 28px);overflow-x:auto;
}
[data-theme="dark"] .bulk-bar{background:#334155;color:#f1f5f9;border:1px solid #475569}
.bulk-bar.show{transform:translate(-50%,0)}
.bulk-bar .bcount{font-size:13px;font-weight:800;padding:0 8px;white-space:nowrap}
.bulk-bar .bdivider{width:1px;height:22px;background:rgba(255,255,255,.2);margin:0 2px}
.bulk-bar button{
  border:0;background:rgba(255,255,255,.1);color:#fff;
  padding:7px 11px;border-radius:9px;font-size:12px;font-weight:700;
  display:inline-flex;align-items:center;gap:5px;transition:all var(--transition);
  white-space:nowrap;
}
.bulk-bar button:hover{background:rgba(255,255,255,.2)}
.bulk-bar button.danger{background:rgba(220,38,38,.3);color:#fecaca}
.bulk-bar button.danger:hover{background:rgba(220,38,38,.5)}
.bulk-bar button svg{width:13px;height:13px}

/* ============ MODALS ============ */
.overlay{
  position:fixed;inset:0;z-index:100;display:none;
  background:rgba(15,23,42,.55);backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
  align-items:center;justify-content:center;padding:20px;
  animation:fadeIn .2s ease both;
}
.overlay.show{display:flex}

.modal{
  background:var(--card);border-radius:20px;width:100%;max-width:480px;
  box-shadow:var(--shadow-lg);animation:modalIn .28s cubic-bezier(.34,1.56,.64,1) both;
  max-height:92vh;overflow:auto;position:relative;
}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-head{
  display:flex;align-items:center;gap:12px;
  padding:20px 22px 6px;position:sticky;top:0;background:var(--card);
  border-radius:20px 20px 0 0;z-index:1;
}
.modal-head h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.3px}
.modal-head .close{
  margin-inline-start:auto;width:34px;height:34px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);display:grid;place-items:center;
  transition:all var(--transition);
}
.modal-head .close:hover{background:var(--surface);transform:rotate(90deg)}
.modal-body{padding:8px 22px 22px}
.modal-sub{margin:0 0 18px;font-size:12.5px;color:var(--muted);font-weight:600}

.mfield{display:block;margin-bottom:14px}
.mfield>span{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:800;color:var(--ink);margin-bottom:7px}
.mfield>span .val{color:var(--blue-700);font-weight:800;background:var(--blue-50);padding:2px 9px;border-radius:8px;font-size:11.5px}
[data-theme="dark"] .mfield>span .val{color:var(--blue-200)}
.mfield input[type=text],.mfield select{
  width:100%;border:1px solid var(--line);border-radius:11px;
  padding:10px 13px;font-size:13.5px;font-weight:700;color:var(--ink);
  background:var(--card);outline:none;transition:all var(--transition);
}
.mfield input[type=text]:focus,.mfield select:focus{
  border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-50);
}
.mfield input[type=range]{
  width:100%;accent-color:var(--blue);cursor:pointer;height:5px;
}
.mfield .hint{font-size:11px;color:var(--muted);font-weight:600;margin-top:5px}

.mrow{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.mswitch{
  display:flex;align-items:center;gap:10px;padding:11px 13px;
  border:1px solid var(--line);border-radius:11px;background:var(--card);
  cursor:pointer;transition:all var(--transition);font-size:12.5px;font-weight:700;
}
.mswitch:hover{border-color:var(--line-2);background:var(--surface)}
.mswitch input{accent-color:var(--blue);width:16px;height:16px;margin:0;cursor:pointer}

.modal-actions{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap}
.modal-actions .btn{flex:1;justify-content:center;min-width:100px}
.modal-actions .btn.primary{flex:1.4}

.export-options{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;
}
.export-btn{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:16px 12px;border-radius:13px;border:1px solid var(--line);
  background:var(--card);cursor:pointer;transition:all var(--transition);
  font-weight:800;font-size:12.5px;color:var(--ink);text-align:center;
}
.export-btn:hover{border-color:var(--blue);background:var(--blue-50);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.export-btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.export-btn.primary:hover{background:var(--blue-700);border-color:var(--blue-700)}
.export-btn svg{width:22px;height:22px;color:var(--blue)}
.export-btn.primary svg{color:#fff}

/* ============ EDITOR ============ */
.editor-overlay{
  position:fixed;inset:0;z-index:150;display:none;
  background:rgba(0,0,0,.92);align-items:stretch;justify-content:stretch;
}
.editor-overlay.show{display:flex;animation:fadeIn .2s ease both}
.editor{
  width:100%;height:100%;display:flex;flex-direction:column;
  color:#f1f5f9;
}
.editor-head{
  padding:14px 20px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(0,0,0,.3);
}
.editor-head h2{margin:0;font-size:15px;font-weight:800;color:#fff}
.editor-head .close{
  margin-inline-start:auto;width:36px;height:36px;border-radius:10px;
  border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);
  display:grid;place-items:center;color:#fff;transition:all var(--transition);
}
.editor-head .close:hover{background:rgba(255,255,255,.15);transform:rotate(90deg)}
.editor-body{
  flex:1;display:grid;grid-template-columns:1fr 320px;
  min-height:0;overflow:hidden;
}
.editor-preview{
  display:grid;place-items:center;padding:24px;overflow:auto;
  background:radial-gradient(circle at center,rgba(255,255,255,.04),transparent 70%);
}
.editor-preview canvas{
  max-width:100%;max-height:100%;background:#fff;border-radius:6px;
  box-shadow:0 24px 60px rgba(0,0,0,.6);
}
.editor-controls{
  background:rgba(255,255,255,.04);border-inline-start:1px solid rgba(255,255,255,.08);
  padding:20px;overflow-y:auto;color:#e2e8f0;
}
.control-group{margin-bottom:20px}
.control-group>label{
  display:flex;justify-content:space-between;align-items:center;
  font-size:12.5px;font-weight:800;color:#cbd5e1;margin-bottom:8px;
}
.control-group>label .val{
  color:#fff;background:rgba(37,99,235,.5);padding:2px 9px;border-radius:8px;font-size:11.5px;
}
.control-group select{
  width:100%;padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);color:#fff;font-size:12.5px;
  font-weight:700;outline:none;transition:all var(--transition);
}
.control-group select:focus{border-color:var(--blue)}
.control-group select option{background:#1e293b;color:#f1f5f9}
.control-group input[type=range]{
  width:100%;accent-color:var(--blue);cursor:pointer;
}
.rotate-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rotate-row button{
  padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);color:#fff;font-weight:700;font-size:12px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:all var(--transition);
}
.rotate-row button:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.25)}
.rotate-row button svg{width:15px;height:15px}
.editor-footer{
  padding:14px 20px;display:flex;gap:9px;align-items:center;
  border-top:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.3);
  flex-wrap:wrap;
}
.editor-footer .spacer{flex:1}
.editor-footer button{
  padding:9px 15px;border-radius:10px;font-size:12.5px;font-weight:800;
  border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);
  color:#fff;transition:all var(--transition);
}
.editor-footer button:hover{background:rgba(255,255,255,.15)}
.editor-footer button.primary{background:var(--blue);border-color:var(--blue)}
.editor-footer button.primary:hover{background:var(--blue-700)}
.editor-footer button.ghost{background:transparent;color:#94a3b8}
.editor-footer button.ghost:hover{color:#fff}

@media(max-width:800px){
  .editor-body{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .editor-preview{padding:14px}

/* ============ PROGRESS OVERLAY ============ */
.progress-overlay{
  position:fixed;inset:0;z-index:200;display:none;
  background:rgba(15,23,42,.75);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);

}
.progress-overlay.show{display:flex;animation:fadeIn .2s ease both}
.progress-box{
  background:var(--card);border-radius:20px;padding:30px 28px;width:100%;max-width:400px;
  box-shadow:var(--shadow-lg);animation:modalIn .3s cubic-bezier(.34,1.56,.64,1) both;

}
.progress-spinner{
  width:56px;height:56px;margin:0 auto 16px;border-radius:50%;
  border:4px solid var(--blue-100);border-top-color:var(--blue);
  animation:spin .85s linear infinite;
}

.progress-title{font-size:15px;font-weight:800;margin:0 0 18px;color:var(--ink)}
.progress-bar{
  height:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:20px;overflow:hidden;margin-bottom:10px;
}
.progress-fill{
  height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--blue-700));
  border-radius:20px;transition:width .25s ease;
}
.progress-text{font-size:12.5px;font-weight:800;color:var(--muted)}
.progress-text b{color:var(--blue-700);font-size:14px}
[data-theme="dark"] .progress-text b{color:var(--blue-200)}

/* ============ PDF PREVIEW MODAL ============ */
.pdf-modal{
  position:fixed;inset:0;z-index:120;display:none;
  background:rgba(15,23,42,.85);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  padding:16px;
}
.pdf-modal.show{display:flex;animation:fadeIn .2s ease both}
.pdf-modal-inner{
  background:var(--card);border-radius:16px;width:100%;max-width:1000px;
  margin:auto;height:calc(100vh - 32px);display:flex;flex-direction:column;
  box-shadow:var(--shadow-lg);overflow:hidden;
  animation:modalIn .3s cubic-bezier(.34,1.56,.64,1) both;
}
.pdf-modal-head{
  display:flex;align-items:center;gap:8px;padding:12px 16px;

}
.pdf-modal-head h2{margin:0;font-size:15px;font-weight:800;margin-inline-end:auto}
.pdf-modal-head .btn{padding:7px 12px;font-size:12px}
.pdf-modal-head .btn svg{width:14px;height:14px}
.pdf-iframe{flex:1;border:0;background:#525659;width:100%}
@media(max-width:700px){

}

/* ============ TOAST ============ */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);

}

[data-theme="dark"] .toast{background:#334155;border:1px solid #475569}
.toast .ico-ok{color:#10b981;width:16px;height:16px;flex:none}

.toast .spinner{

<script>
(function(){
'use strict';

/* ============================================================
   STATE
   ============================================================ */
const state = {
  items: [],
  selected: new Set(),
  view: 'grid',
  theme: 'light',
  editingId: null,
  editorOriginal: null,
  lastPDF: null
};
let uid = 0;

const $ = s => document.querySelector(s);
const grid = $('#grid');
const drop = $('#drop');
const fileInput = $('#fileInput');
const toolbar = $('#toolbar');
const toast = $('#toast');

/* ============================================================
   UTILS
   ============================================================ */
let toastTimer = null;
function showToast(msg, kind){
  kind = kind || 'info';
  let iconHtml = '';
  if (kind === 'loading') iconHtml = '<div class="spinner"></div>';
  else if (kind === 'ok') iconHtml = '<svg class="ico-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  else if (kind === 'err') iconHtml = '<svg class="ico-err" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>';
  toast.innerHTML = iconHtml + '<span>' + msg + '</span>';
  toast.classList.add('show');
  clearTimeout(toastTimer);
  if (kind !== 'loading'){
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
  }
}
function hideToast(){ toast.classList.remove('show'); }

function loadImage(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load failed')); };
    img.src = url;
  });
}

/* ============================================================
   IMAGE PROCESSING
   ============================================================ */
function stretchHistogram(d, lowFrac, highFrac){
  const hist = new Uint32Array(256);
  const n = d.length / 4;
  for (let i = 0; i < d.length; i += 4) hist[d[i]]++;
  let acc = 0, lo = 0;
  for (let i = 0; i < 256; i++){ acc += hist[i]; if (acc >= n * lowFrac){ lo = i; break; } }
  acc = 0; let hi = 255;
  for (let i = 255; i >= 0; i--){ acc += hist[i]; if (acc >= n * highFrac){ hi = i; break; } }
  if (hi - lo < 8) return;
  const scale = 255 / (hi - lo);
  for (let i = 0; i < d.length; i += 4){
    let v = (d[i] - lo) * scale;
    v = v < 0 ? 0 : v > 255 ? 255 : v;
    d[i] = d[i+1] = d[i+2] = v;
  }
}

function otsuThreshold(d){
  const hist = new Uint32Array(256);
  const n = d.length / 4;
  for (let i = 0; i < d.length; i += 4) hist[d[i]]++;
  let sum = 0;
  for (let i = 0; i < 256; i++) sum += i * hist[i];
  let sumB = 0, wB = 0, best = 0, thr = 128;
  for (let i = 0; i < 256; i++){
    wB += hist[i]; if (!wB) continue;
    const wF = n - wB; if (!wF) break;
    sumB += i * hist[i];
    const mB = sumB / wB, mF = (sum - sumB) / wF;
    const between = wB * wF * (mB - mF) * (mB - mF);
    if (between > best){ best = between; thr = i; }
  }
  return thr;
}

function applyBrightnessContrast(d, brightness, contrast){
  if (brightness === 100 && contrast === 100) return;
  const b = brightness / 100;
  const c = (contrast - 100) / 100 + 1;
  for (let i = 0; i < d.length; i += 4){
    for (let j = 0; j < 3; j++){
      let v = d[i+j] * b;
      v = ((v / 255 - 0.5) * c + 0.5) * 255;
      d[i+j] = v < 0 ? 0 : v > 255 ? 255 : v;
    }
  }
}

function applyFilter(canvas, mode, brightness, contrast){
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = imgData.data;

  // grayscale base
  for (let i = 0; i < d.length; i += 4){
    const g = (0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2]) | 0;
    d[i] = d[i+1] = d[i+2] = g;
  }

  applyBrightnessContrast(d, brightness || 100, contrast || 100);

  if (mode === 'original'){
    // restore full color if original (skip grayscale)
    ctx.drawImage(canvas, 0, 0); // noop
    // Actually for "original" we should not have converted to grayscale
    // So redo: reload pixels won't work. Instead handle original before grayscale.
  }

  if (mode === 'gray'){
    ctx.putImageData(imgData, 0, 0);
    return;
  }

  if (mode === 'scan'){
    stretchHistogram(d, 0.02, 0.02);
    for (let i = 0; i < d.length; i += 4){
      if (d[i] > 224) d[i] = d[i+1] = d[i+2] = 255;
    }
  } else if (mode === 'bw'){
    stretchHistogram(d, 0.03, 0.03);
    const t = otsuThreshold(d);
    for (let i = 0; i < d.length; i += 4){
      const v = d[i] > t ? 255 : 0;
      d[i] = d[i+1] = d[i+2] = v;
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function applyFilterFull(canvas, mode, brightness, contrast){
  // Handle "original" mode separately (keep color, only apply brightness/contrast)
  if (mode === 'original'){
    if (brightness === 100 && contrast === 100) return;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    applyBrightnessContrast(imgData.data, brightness, contrast);
    ctx.putImageData(imgData, 0, 0);
    return;
  }
  applyFilter(canvas, mode, brightness, contrast);
}

function cropToContent(canvas){
  const w = canvas.width, h = canvas.height;
  if (w < 8 || h < 8) return canvas;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const d = ctx.getImageData(0, 0, w, h).data;

  let r = 0, g = 0, b = 0, n = 0;
  const sample = (x, y) => { const i = (y*w+x)*4; r+=d[i]; g+=d[i+1]; b+=d[i+2]; n++; };
  for (let x = 0; x < w; x += 3){ sample(x, 0); sample(x, h-1); }
  for (let y = 0; y < h; y += 3){ sample(0, y); sample(w-1, y); }
  r /= n; g /= n; b /= n;

  const THR = 40;
  let minX = w, minY = h, maxX = -1, maxY = -1;

  for (let y = 0; y < h; y++){
    const rowOff = y * w * 4;
    for (let x = 0; x < w; x++){
      const i = rowOff + x * 4;
      const diff = Math.abs(d[i]-r) + Math.abs(d[i+1]-g) + Math.abs(d[i+2]-b);
      if (diff > THR){
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return canvas;
  const pad = Math.max(2, Math.round(Math.min(w, h) * 0.012));
  minX = Math.max(0, minX - pad);
  minY = Math.max(0, minY - pad);
  maxX = Math.min(w - 1, maxX + pad);
  maxY = Math.min(h - 1, maxY + pad);
  const nw = maxX - minX + 1, nh = maxY - minY + 1;
  if (nw < w * 0.3 || nh < h * 0.3) return canvas;
  if (nw === w && nh === h) return canvas;
  const out = document.createElement('canvas');
  out.width = nw; out.height = nh;
  out.getContext('2d').drawImage(canvas, minX, minY, nw, nh, 0, 0, nw, nh);
  return out;
}

function buildCanvas(item, maxDim){
  const img = item.img;
  const rot = ((item.rotation % 360) + 360) % 360;
  const sw = img.naturalWidth || img.width;
  const sh = img.naturalHeight || img.height;
  const swapped = (rot === 90 || rot === 270);
  const W = swapped ? sh : sw;
  const H = swapped ? sw : sh;
  let scale = 1;
  if (maxDim && Math.max(W, H) > maxDim) scale = maxDim / Math.max(W, H);
  const cw = Math.max(1, Math.round(W * scale));
  const ch = Math.max(1, Math.round(H * scale));

  let c = document.createElement('canvas');
  c.width = cw; c.height = ch;
  const ctx = c.getContext('2d', { willReadFrequently: true });

  ctx.save();
  ctx.translate(cw / 2, ch / 2);
  ctx.rotate(rot * Math.PI / 180);
  ctx.drawImage(img, -sw*scale/2, -sh*scale/2, sw*scale, sh*scale);
  ctx.restore();

  if (item.crop) c = cropToContent(c);
  applyFilterFull(c, item.filter, item.brightness, item.contrast);
  return c;
}

function getPreview(item){
  if (!item._prev) item._prev = buildCanvas(item, 440);
  return item._prev;
}
function invalidate(item){ item._prev = null; }

   GRID RENDER
   ============================================================ */
function renderGrid(){
  grid.innerHTML = '';
  grid.classList.toggle('compact', state.view === 'compact');

  if (state.items.length === 0){
    toolbar.hidden = true;
    updateBulkBar();
    grid.innerHTML = `
      <div class="empty">
        <div class="empty-icon">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
        </div>
        <h3>لا توجد صور بعد</h3>
        <p>ابدأ برفع بعض الصور لتحويلها إلى PDF احترافي</p>
      </div>`;
    return;
  }

  toolbar.hidden = false;
  $('#count').textContent = state.items.length;

  state.items.forEach((item, index) => {

  });

  updateBulkBar();

function buildCard(item, index){
  const card = document.createElement('div');
  card.className = 'card' + (state.selected.has(item.id) ? ' selected' : '');
  card.draggable = true;
  card.dataset.id = item.id;

  const sel = state.selected.has(item.id);
  card.innerHTML = `
    <div class="thumb" data-action="edit">
      <span class="num">${index+1}</span>
      <div class="select-chk" data-action="select">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <canvas></canvas>
    </div>
    <div class="card-body">
      <div class="row">
        <select class="sel">
          <option value="scan">سكان محسّن</option>
          <option value="bw">أبيض وأسود</option>
          <option value="gray">رمادي</option>
          <option value="original">أصلي</option>
        </select>
      </div>
      <div class="row">
        <label class="chk" style="flex:1"><input type="checkbox" class="cropChk"> قص</label>
        <button class="ico rotR" title="تدوير">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
        <button class="ico editBtn" title="تحرير">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
        </button>
        <button class="ico del" title="حذف">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>`;

  const s = card.querySelector('.sel');
  s.value = item.filter;
  card.querySelector('.cropChk').checked = !!item.crop;

  const cv = card.querySelector('canvas');
  const prev = getPreview(item);
  cv.width = prev.width; cv.height = prev.height;
  cv.getContext('2d').drawImage(prev, 0, 0);

  const redraw = () => {
    invalidate(item);
    const p = getPreview(item);
    cv.width = p.width; cv.height = p.height;
    cv.getContext('2d').drawImage(p, 0, 0);
  };

  s.addEventListener('change', e => { item.filter = e.target.value; redraw(); });
  card.querySelector('.cropChk').addEventListener('change', e => { item.crop = e.target.checked; redraw(); });
  card.querySelector('.rotR').addEventListener('click', e => {
    e.stopPropagation();
    item.rotation = (item.rotation + 90) % 360;
    redraw();
  });
  card.querySelector('.editBtn').addEventListener('click', e => { e.stopPropagation(); openEditor(item.id); });
  card.querySelector('.del').addEventListener('click', e => {
    e.stopPropagation();
    state.items = state.items.filter(x => x.id !== item.id);
    state.selected.delete(item.id);
    renderGrid();
  });

  // toggle select
  card.querySelector('[data-action="select"]').addEventListener('click', e => {
    e.stopPropagation();
    if (state.selected.has(item.id)) state.selected.delete(item.id);
    else state.selected.add(item.id);
    card.classList.toggle('selected', state.selected.has(item.id));
    updateBulkBar();
  });

  // open editor on thumb click
  card.querySelector('[data-action="edit"]').addEventListener('click', () => openEditor(item.id));

  // drag reorder
  card.addEventListener('dragstart', e => {
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', String(item.id));
    window.__dragId = item.id;
  });
  card.addEventListener('dragend', () => {
    card.classList.remove('dragging');
    document.querySelectorAll('.card').forEach(c => c.classList.remove('over'));
    window.__dragId = null;
  });
  card.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    if (window.__dragId !== item.id) card.classList.add('over');
  });
  card.addEventListener('dragleave', () => card.classList.remove('over'));
  card.addEventListener('drop', e => {
    e.preventDefault(); e.stopPropagation();
    card.classList.remove('over');
    const fromId = window.__dragId;
    if (!fromId || fromId === item.id) return;
    const from = state.items.findIndex(x => x.id === fromId);
    const to = state.items.findIndex(x => x.id === item.id);
    if (from < 0 || to < 0) return;
    const [moved] = state.items.splice(from, 1);
    state.items.splice(to, 0, moved);
    renderGrid();
  });

  return card;
}

function updateBulkBar(){
  const bar = $('#bulkBar');
  const n = state.selected.size;
  if (n > 0){
    $('#bulkCount').textContent = n + (n === 1 ? ' محدد' : ' محدد');
    bar.classList.add('show');
  } else {
    bar.classList.remove('show');
  }
}

/* ============================================================
   FILE HANDLING
   ============================================================ */
async function addFiles(fileList){
  const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
  if (!files.length){
    showToast('الرجاء اختيار ملفات صور صالحة', 'err');
    return;
  }

  showToast(`جارٍ تحميل ${files.length} صورة...`, 'loading');

  try {
    const loaded = await Promise.all(files.map(async f => {
      try { return { img: await loadImage(f), name: f.name }; }
      catch (e){ return null; }
    }));
    const valid = loaded.filter(Boolean);
    valid.forEach(({ img, name }) => {
      state.items.push({
        id: ++uid, img, name, rotation: 0, filter: 'scan',
        crop: true, brightness: 100, contrast: 100, _prev: null
      });
    });
    renderGrid();
    hideToast();
    if (valid.length){
      showToast(`تمت إضافة ${valid.length} صورة بنجاح`, 'ok');
    } else {
      showToast('تعذّر تحميل الصور', 'err');
    }
  } catch (e){
    hideToast();
    showToast('حدث خطأ أثناء التحميل', 'err');
  }
}

   EDITOR
   ============================================================ */
function openEditor(id){
  const item = state.items.find(x => x.id === id);
  if (!item) return;
  state.editingId = id;
  state.editorOriginal = {
    rotation: item.rotation, filter: item.filter, crop: item.crop,
    brightness: item.brightness, contrast: item.contrast
  };
  $('#editorFilter').value = item.filter;
  $('#editorBrightness').value = item.brightness;
  $('#editorContrast').value = item.contrast;
  $('#editorCrop').checked = !!item.crop;
  $('#brVal').textContent = item.brightness;
  $('#ctVal').textContent = item.contrast;
  updateEditorPreview();
  $('#editorOverlay').classList.add('show');
}

function updateEditorPreview(){
  const item = state.items.find(x => x.id === state.editingId);
  if (!item) return;
  // apply live control values temporarily
  item.filter = $('#editorFilter').value;
  item.brightness = parseInt($('#editorBrightness').value, 10);
  item.contrast = parseInt($('#editorContrast').value, 10);
  item.crop = $('#editorCrop').checked;

  const c = buildCanvas(item, 900);
  const ec = $('#editorCanvas');
  ec.width = c.width;
  ec.height = c.height;
  ec.getContext('2d').drawImage(c, 0, 0);
}

function closeEditor(save){
  const item = state.items.find(x => x.id === state.editingId);
  if (item){
    if (save){
      item.filter = $('#editorFilter').value;
      item.brightness = parseInt($('#editorBrightness').value, 10);
      item.contrast = parseInt($('#editorContrast').value, 10);
      item.crop = $('#editorCrop').checked;
      invalidate(item);
    } else {
      Object.assign(item, state.editorOriginal);
      invalidate(item);
    }
  }
  state.editingId = null;
  state.editorOriginal = null;
  $('#editorOverlay').classList.remove('show');
  renderGrid();
}

/* ============================================================
   PDF GENERATION
   ============================================================ */
const PAGE_SIZES = {
  a4: [210, 297], a5: [148, 210],
  letter: [215.9, 279.4], legal: [215.9, 355.6]
};
const QUALITY = {
  high:   { maxDim: 2400, jpeg: 0.94 },
  medium: { maxDim: 1700, jpeg: 0.88 },
  low:    { maxDim: 1200, jpeg: 0.78 }
};

function makeWatermarkDataURL(text, pageW, pageH){
  const scale = 4;
  const c = document.createElement('canvas');
  c.width = Math.round(pageW * scale);
  c.height = Math.round(pageH * scale);
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  const fontSize = Math.round(c.height * 0.13);
  ctx.font = `bold ${fontSize}px Cairo, sans-serif`;
  ctx.fillStyle = 'rgba(0,0,0,0.07)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.translate(c.width / 2, c.height / 2);
  ctx.rotate(-Math.PI / 6);
  // tiled watermark
  const stepX = ctx.measureText(text).width + fontSize * 3;
  const stepY = fontSize * 2.6;
  for (let y = -c.height; y < c.height; y += stepY){
    for (let x = -c.width; x < c.width; x += stepX){
      ctx.fillText(text, x, y);
    }
  }
  return c.toDataURL('image/png');
}

function setProgress(pct, detail){
  $('#progressFill').style.width = pct + '%';
  $('#progressPct').textContent = Math.round(pct) + '%';
  $('#progressDetail').textContent = detail || '';
}

async function generatePDF(opts){
  const { jsPDF } = window.jspdf;
  const [pwBase, phBase] = PAGE_SIZES[opts.sizeKey];
  const q = QUALITY[opts.quality] || QUALITY.medium;
  let doc = null;
  const total = state.items.length;

  for (let i = 0; i < total; i++){
    const item = state.items[i];
    const canvas = buildCanvas(item, q.maxDim);
    const imgData = canvas.toDataURL('image/jpeg', q.jpeg);

    let orientation = opts.orientation;
    if (orientation === 'auto'){
      orientation = canvas.width > canvas.height ? 'landscape' : 'portrait';
    }
    const pageW = orientation === 'landscape' ? phBase : pwBase;
    const pageH = orientation === 'landscape' ? pwBase : phBase;

    if (!doc){
      doc = new jsPDF({ unit: 'mm', format: [pageW, pageH], orientation, compress: true });
    } else {
      doc.addPage([pageW, pageH], orientation);
    }

    const availW = Math.max(1, pageW - opts.margin * 2);
    const availH = Math.max(1, pageH - opts.margin * 2);
    const ratio = Math.min(availW / canvas.width, availH / canvas.height);
    const w = canvas.width * ratio;
    const h = canvas.height * ratio;
    const x = (pageW - w) / 2;
    const y = (pageH - h) / 2;

    if (opts.border){
      doc.setDrawColor(200, 200, 200);
      doc.setLineWidth(0.4);
      doc.rect(x - 2, y - 2, w + 4, h + 4);
    }

    doc.addImage(imgData, 'JPEG', x, y, w, h, undefined, 'FAST');

    if (opts.watermark){
      const wm = makeWatermarkDataURL(opts.watermark, pageW, pageH);
      doc.addImage(wm, 'PNG', 0, 0, pageW, pageH);
    }

    if (opts.pageNumbers){
      doc.setFontSize(9);
      doc.setTextColor(130, 130, 130);
      doc.text(`${i+1} / ${total}`, pageW - 12, pageH - 7, { align: 'right' });
    }

    const pct = ((i + 1) / total) * 100;
    setProgress(pct, `${i + 1} من ${total}`);
    await new Promise(r => setTimeout(r, 0));
  }

  return doc;
}

function gatherOptions(){
  return {
    sizeKey: $('#pageSize').value,
    orientation: $('#orientation').value,
    margin: parseFloat($('#margin').value) || 0,
    quality: $('#quality').value,
    pageNumbers: $('#optPageNum').checked,
    border: $('#optBorder').checked,
    watermark: ($('#watermark').value || '').trim(),
    fileName: ($('#fileName').value || 'مستند').trim()
  };
}

/* ============================================================
   EXPORT FLOW
   ============================================================ */
async function runExport(mode){
  if (state.items.length === 0){
    showToast('أضف صورًا أولاً', 'err');
    return;
  }
  if (!window.jspdf || !window.jspdf.jsPDF){
    showToast('تعذّر تحميل مكتبة PDF', 'err');
    return;
  }

  $('#exportOverlay').classList.remove('show');
  $('#progressOverlay').classList.add('show');
  $('#progressTitle').textContent = 'جارٍ إنشاء PDF...';
  setProgress(0, '');

  try {
    const opts = gatherOptions();
    const doc = await generatePDF(opts);

    setProgress(100, '');
    await new Promise(r => setTimeout(r, 120));

    const blob = doc.output('blob');
    const blobUrl = URL.createObjectURL(blob);
    const fileName = opts.fileName + '.pdf';

    state.lastPDF = { doc, blob, blobUrl, fileName };

    $('#progressOverlay').classList.remove('show');

    if (mode === 'preview'){
      showPDFPreview(blobUrl, fileName);
    } else if (mode === 'download'){
      doc.save(fileName);
      showToast('تم تنزيل الملف بنجاح', 'ok');
    }
  } catch (err){
    console.error(err);
    $('#progressOverlay').classList.remove('show');
    showToast('حدث خطأ أثناء التصدير', 'err');
  }
}

function showPDFPreview(url, name){
  $('#pdfTitle').textContent = name;
  $('#pdfIframe').src = url;
  $('#pdfModal').classList.add('show');
}

$('#editorReset').addEventListener('click', () => {
  const item = state.items.find(x => x.id === state.editingId);
  if (!item) return;
  item.rotation = 0; item.filter = 'scan'; item.crop = true;
  item.brightness = 100; item.contrast = 100;
  $('#editorFilter').value = 'scan';
  $('#editorBrightness').value = 100;
  $('#editorContrast').value = 100;
  $('#editorCrop').checked = true;
  $('#brVal').textContent = '100';
  $('#ctVal').textContent = '100';
  updateEditorPreview();
});

// Export modal
$('#btnExport').addEventListener('click', () => {
  if (!state.items.length){ showToast('أضف صورًا أولاً', 'err'); return; }
  $('#exportOverlay').classList.add('show');
});
$('#exportClose').addEventListener('click', () => $('#exportOverlay').classList.remove('show'));
$('#exportOverlay').addEventListener('click', e => {
  if (e.target === $('#exportOverlay')) $('#exportOverlay').classList.remove('show');
});
$('#margin').addEventListener('input', e => { $('#marginVal').textContent = e.target.value + ' مم'; });
$('#previewPDF').addEventListener('click', () => runExport('preview'));
$('#downloadPDF').addEventListener('click', () => runExport('download'));

// PDF preview modal actions
$('#pdfClose').addEventListener('click', () => {
  $('#pdfModal').classList.remove('show');
  $('#pdfIframe').src = 'about:blank';
});
$('#pdfDownload').addEventListener('click', () => {
  if (state.lastPDF){ state.lastPDF.doc.save(state.lastPDF.fileName); showToast('تم التنزيل', 'ok'); }
});
$('#pdfPrint').addEventListener('click', () => {
  if (!state.lastPDF) return;
  const w = window.open(state.lastPDF.blobUrl, '_blank');
  if (w){
    w.addEventListener('load', () => { try { w.print(); } catch(e){} }, { once: true });
  }
});
$('#pdfShare').addEventListener('click', async () => {
  if (!state.lastPDF) return;
  const file = new File([state.lastPDF.blob], state.lastPDF.fileName, { type: 'application/pdf' });
  if (navigator.canShare && navigator.canShare({ files: [file] })){
    try {
      await navigator.share({ files: [file], title: state.lastPDF.fileName });
    } catch (e){
      if (e.name !== 'AbortError') showToast('تعذّرت المشاركة', 'err');
    }
  } else {
    showToast('المشاركة غير مدعومة في هذا المتصفح', 'err');
  }
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select')) return;
  if (e.key === 'Escape'){
    $('#exportOverlay').classList.remove('show');
    $('#pdfModal').classList.remove('show');
    $('#editorOverlay').classList.remove('show');
    if (state.editingId) closeEditor(false);
    if (state.selected.size){ state.selected.clear(); renderGrid(); }
  }
  if ((e.key === 'Delete' || e.key === 'Backspace') && state.selected.size){
    e.preventDefault();
    if (confirm(`حذف ${state.selected.size} صورة؟`)){
      state.items = state.items.filter(it => !state.selected.has(it.id));
      state.selected.clear();
      renderGrid();
    }
  }
  if (e.key === 'a' && (e.ctrlKey || e.metaKey)){
    e.preventDefault();
    state.items.forEach(it => state.selected.add(it.id));
    renderGrid();
  }
  if (e.key === 'e' && (e.ctrlKey || e.metaKey)){
    e.preventDefault();
    if (state.items.length) $('#btnExport').click();
  }
});

/* ============================================================
   INIT
   ============================================================ */
try {
  const saved = localStorage.getItem('theme');
  if (saved === 'dark' || saved === 'light'){
    state.theme = saved;
    document.documentElement.setAttribute('data-theme', saved);
  }
} catch(e){}

renderGrid();

})();
</script>
</body>
</html>
